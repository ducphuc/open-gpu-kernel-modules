name: nccl-vf-rdma-test

x-nccl-env: &nccl-env
  NCCL_DEBUG: INFO
  NCCL_DEBUG_SUBSYS: INIT,NET,GRAPH,P2P,SHM
  NCCL_NET: IB
  NCCL_NET_PLUGIN: none
  NCCL_COLLNET_ENABLE: 0
  NCCL_P2P_DISABLE: 1
  NCCL_SHM_DISABLE: 1
  NCCL_IB_DISABLE: 0
  NCCL_IB_GID_INDEX: ${GID_INDEX:-3}
  NCCL_NET_GDR_LEVEL: SYS
  NCCL_DMABUF_ENABLE: 1
  NCCL_CROSS_NIC: 1
  NCCL_SOCKET_IFNAME: ^docker,lo
  LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/lib:${LD_LIBRARY_PATH:-}

x-common: &common
  build:
    context: ./vf-netns-image
  ipc: host
  network_mode: none
  ulimits:
    memlock: -1
  cap_add:
    - IPC_LOCK
    - NET_ADMIN
  devices:
    - /dev/infiniband:/dev/infiniband
  volumes:
    - type: volume
      source: ssh-share
      target: /ssh-share
  restart: "no"
  environment: *nccl-env

services:
  nccl-vf-launcher:
    <<: *common
    container_name: ${LAUNCHER:-nccl-vf-launcher}
    hostname: ${LAUNCHER:-nccl-vf-launcher}
    environment:
      <<: *nccl-env
      NCCL_IB_HCA: ${LAUNCHER_HCA:-mlx5_2}
      NCCL_SOCKET_IFNAME: ^docker,lo
    command:
      - bash
      - -lc
      - |
          set -e
          mkdir -p /var/run/sshd /root/.ssh /ssh-share
          chmod 700 /root/.ssh
          [ -f /ssh-share/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -f /ssh-share/id_ed25519
          /usr/sbin/sshd -p "${SSH_PORT:-2222}" -o StrictModes=no
          sleep infinity
    gpus:
      - driver: nvidia
        device_ids: ['0']
        capabilities: [gpu]

  nccl-vf-worker:
    <<: *common
    container_name: ${WORKER:-nccl-vf-worker}
    hostname: ${WORKER:-nccl-vf-worker}
    environment:
      <<: *nccl-env
      NCCL_IB_HCA: ${WORKER_HCA:-mlx5_3}
      NCCL_SOCKET_IFNAME: ^docker,lo
    command:
      - bash
      - -lc
      - |
          set -e
          mkdir -p /var/run/sshd /root/.ssh /ssh-share
          chmod 700 /root/.ssh
          /usr/sbin/sshd -p "${SSH_PORT:-2222}" -o StrictModes=no
          (
            while true; do
              if [ -f /ssh-share/id_ed25519.pub ]; then
                cat /ssh-share/id_ed25519.pub > /root/.ssh/authorized_keys
                chmod 600 /root/.ssh/authorized_keys
                break
              fi
              sleep 1
            done
          ) &
          sleep infinity
    gpus:
      - driver: nvidia
        device_ids: ['1']
        capabilities: [gpu]

volumes:
  ssh-share:
